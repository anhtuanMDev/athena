<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">

  <!-- Main outer circle -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#334155" stroke-width="18"/>

  <!-- Inner glowing circle -->
  <circle cx="100" cy="100" r="55" fill="none" stroke="#1e40af" stroke-width="8"/>

  <!-- Orange accent arcs -->
  <!-- Top arc -->
  <path d="M 65 45 Q 100 25 135 45" fill="none" stroke="#f59e0b" stroke-width="14" stroke-linecap="round"/>
  <!-- Bottom arc -->
  <path d="M 65 155 Q 100 175 135 155" fill="none" stroke="#f59e0b" stroke-width="14" stroke-linecap="round"/>

  <!-- Crosshair / Axes -->
  <line x1="45" y1="100" x2="155" y2="100" stroke="#64748b" stroke-width="6"/>
  <line x1="100" y1="45" x2="100" y2="155" stroke="#64748b" stroke-width="6"/>

  <!-- Center dot -->
  <circle cx="100" cy="100" r="9" fill="#f59e0b"/>
  <circle cx="100" cy="100" r="4" fill="#1e3a8a"/>

  <!-- Cardinal orange markers -->
  <!-- Top -->
  <rect x="93" y="28" width="14" height="22" rx="4" fill="#f59e0b"/>
  <!-- Bottom -->
  <rect x="93" y="150" width="14" height="22" rx="4" fill="#f59e0b"/>
  <!-- Left -->
  <rect x="28" y="93" width="22" height="14" rx="4" fill="#f59e0b"/>
  <!-- Right -->
  <rect x="150" y="93" width="22" height="14" rx="4" fill="#f59e0b"/>

</svg>