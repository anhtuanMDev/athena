name = "athena-admin"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = "./build/client"

[env.production]
vars = { NODE_ENV = "production" }

# ==========================================================
# Required secrets (set via `wrangler secret put`):
#   GITHUB_TOKEN
#   GITHUB_OWNER
#   GITHUB_REPO
#   GITHUB_BRANCH
#   ADMIN_PASSWORD_HASH
#   SESSION_SECRET
# ==========================================================
