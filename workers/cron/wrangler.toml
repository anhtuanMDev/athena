name = "athena-cron-worker"
main = "src/index.ts"
compatibility_date = "2024-03-20"

# Run different tasks on different schedules
[triggers]
crons = [
  "0 * * * *",      # Top of every hour
  "*/15 * * * *",   # Every 15 minutes
  "0 0 * * *"       # Midnight every day
]

# ==========================================================
# Required secrets (set via `wrangler secret put`):
#   GITHUB_TOKEN
#   GITHUB_OWNER
#   GITHUB_REPO
#   GITHUB_BRANCH
# ==========================================================
