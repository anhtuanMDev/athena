name = "athena-cron-worker"
main = "src/index.ts"
compatibility_date = "2024-03-20"

# Run different tasks on different schedules
[triggers]
crons = [
  "0 * * * *",      # Hourly
  "0 0 * * *",      # Daily
  "0 0 * * 0"       # Weekly (Sunday at midnight)
]

# ==========================================================
# Required secrets (set via `wrangler secret put`):
#   GITHUB_TOKEN
#   GITHUB_OWNER
#   GITHUB_REPO
#   GITHUB_BRANCH
# ==========================================================
