name = "hero-shooter-info-api"
main = "src/index.js"
compatibility_date = "2026-06-01"

[vars]
GITHUB_OWNER = "YOUR_ORG"
GITHUB_REPO = "YOUR_REPO"
BRANCH = "main"

# If you hit GitHub API rate limits on the /heroes and /patches list endpoints,
# add a token as a secret (never commit it to wrangler.toml):
#   wrangler secret put GITHUB_TOKEN
# then read env.GITHUB_TOKEN in listDirectory() and add:
#   headers: { Authorization: `Bearer ${env.GITHUB_TOKEN}` }
